<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Edilson Nunez — Senior Front-end Engineer</title>
  <desc id="desc">Building fast, accessible web products and the design systems behind them.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow-indigo" cx="0.82" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0.15" cy="1.1" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .kw { fill: #C084FC; }
      .id { fill: #F3F4F6; }
      .key { fill: #7DD3FC; }
      .str { fill: #86EFAC; }
      .pun { fill: #9CA3AF; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background -->
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow-indigo)"/>
    <rect width="1200" height="320" fill="url(#glow-cyan)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Intro -->
  <text x="64" y="96" class="mono" font-size="14" letter-spacing="2" fill="#22D3EE">SENIOR FRONT-END ENGINEER · UI SPECIALIST</text>
  <text x="62" y="164" class="sans" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#F9FAFB">Edilson Nunez</text>
  <rect x="64" y="188" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="230" class="sans" font-size="20" fill="#9CA3AF">Building fast, accessible web products</text>
  <text x="64" y="258" class="sans" font-size="20" fill="#9CA3AF">and the design systems behind them.</text>

  <!-- Code window -->
  <g transform="translate(700 52)">
    <rect width="436" height="216" rx="12" fill="#0B1220" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="22" cy="20" r="5" fill="#F87171"/>
    <circle cx="40" cy="20" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="20" r="5" fill="#34D399"/>
    <text x="218" y="24" text-anchor="middle" class="mono" font-size="12" fill="#6B7280">profile.ts</text>
    <line x1="0" y1="40" x2="436" y2="40" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <g class="mono" font-size="14">
      <text x="24" y="70"><tspan class="kw">const</tspan><tspan class="id"> engineer </tspan><tspan class="pun">= {</tspan></text>
      <text x="41" y="94"><tspan class="key">role</tspan><tspan class="pun">: </tspan><tspan class="str">'Front-end · UI'</tspan><tspan class="pun">,</tspan></text>
      <text x="41" y="118"><tspan class="key">stack</tspan><tspan class="pun">: [</tspan><tspan class="str">'Vue'</tspan><tspan class="pun">, </tspan><tspan class="str">'React'</tspan><tspan class="pun">, </tspan><tspan class="str">'Go'</tspan><tspan class="pun">],</tspan></text>
      <text x="41" y="142"><tspan class="key">focus</tspan><tspan class="pun">: [</tspan><tspan class="str">'DX'</tspan><tspan class="pun">, </tspan><tspan class="str">'Perf'</tspan><tspan class="pun">, </tspan><tspan class="str">'AI'</tspan><tspan class="pun">],</tspan></text>
      <text x="41" y="166"><tspan class="key">experience</tspan><tspan class="pun">: </tspan><tspan class="str">'10+ years'</tspan><tspan class="pun">,</tspan></text>
      <text x="24" y="190"><tspan class="pun">};</tspan></text>
    </g>
    <rect x="46" y="178" width="8" height="16" fill="#22D3EE" class="cursor"/>
  </g>
</svg>
